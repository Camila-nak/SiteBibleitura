<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="cadastro.css">
    <title>Bibleiura cadastro - Literatura nacional</title>

</head>

<body>

    <!-- Área wrapper -->
    <div class="wrapper">

        <div class="container">

            <!-- Painel da esquerda -->
            <div class="column left">

                <div class="logo">BIBLEITURA</div>
                    <div class="categoria">LITERATURA BRASILEIRA</div>
                        <h1>Descubra as vozes que moldaram o Brasil</h1>
                        <p>Reúna, atraia e compartilhe suas leituras com uma comunidade 
                        apaixonada por livros brasileiros.</p>
                    <div class="autores">

                </div>

            </div>

            <!-- Painel da direita -->
            <div class="column right">

                <div class="form-container">
                    <div class="header-form">
                        <div class="circle-icon">👤</div>
                        <h2>Criar sua conta</h2>
                        <p class="subtitulo">Já tem uma conta? <a href="login.html">Entrar</a></p>
                    </div>

                    <form>
                        <div class="form-group">
                            <label>NOME COMPLETO</label>
                            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                        </div>

                        <div class="form-group">
                            <label>E-MAIL</label>
                            <input type="email" id="email" name="email" required placeholder="bibleitura@exemplo.com.br">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>NASCIMENTO</label>
                                <input type="date" id="nascimento" name="nascimento" required>
                            </div>

                            <div class="form-group">

                                <label>ESTADO</label>

                                <select>
                                    <option value="">UF</option>
                                    <option value="AC">AC</option>
                                    <option value="AL">AL</option>
                                    <option value="AP">AP</option>
                                    <option value="AM">AM</option>
                                    <option value="BA">BA</option>
                                    <option value="CE">CE</option>
                                    <option value="DF">DF</option>
                                    <option value="ES">ES</option>
                                    <option value="GO">GO</option>
                                    <option value="MA">MA</option>
                                    <option value="MT">MT</option>
                                    <option value="MS">MS</option>
                                    <option value="MG">MG</option>
                                    <option value="PA">PA</option>
                                    <option value="PB">PB</option>
                                    <option value="PR">PR</option>
                                    <option value="PE">PE</option>
                                    <option value="PI">PI</option>
                                    <option value="RJ">RJ</option>
                                    <option value="RN">RN</option>
                                    <option value="RS">RS</option>
                                    <option value="RO">RO</option>
                                    <option value="RR">RR</option>
                                    <option value="SC">SC</option>
                                    <option value="SP">SP</option>
                                    <option value="SE">SE</option>
                                    <option value="TO">TO</option>
                                </select>

                            </div>

                        </div>

                        <div class="form-group">

                            <label>SENHA</label>

                            <div class="password-input">

                                <input type="password" id="senha" name="senha" required placeholder="Mínimo 8 caracteres">
                                <span class="eye-icon">👁️</span>

                            </div>

                        </div>

                        <div class="form-group">

                            <label>CONFIRMAR SENHA</label>

                            <div class="password-input">
                                <input type="password" id="confirmar-senha" name="confirmar-senha" required placeholder="Repita a senha">
                                <span class="eye-icon">👁️</span>

                            </div>

                        </div>

                        <div class="checkbox-group">

                            <input type="checkbox" id="termos" name="checkbox" required>
                            <label for="termos">Concordo com os <a href="#">Termos de Uso e Política de Privacidade</a> da Bibleitura.</label>

                        </div>

                        <button type="submit" class="btn-continuar">CONTINUAR ></button>
                    </form>
                </div>

            </div>

        </div>
        
    </div>

    <script>
        document.querySelectorAll('.eye-icon').forEach(icon =>
        {
            icon.addEventListener('click', () => 
            {
                    const input = icon.previousElementSibling;
                if (input.type === 'password')
                {
                    input.type = 'text';
                    icon.textContent = '🙈';
                } 
                else
                {
                    input.type = 'password';
                    icon.textContent = '👁️';
                }
            });
        });
    </script>

</body>

</html>
