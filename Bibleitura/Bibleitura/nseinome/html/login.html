<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
    <title>Bibleiura login - Literatura nacional</title>

    
</head>

<body>

    <div class="wrapper">
        <div class="container">
            <!-- Painel da esquerda -->
            <div class="column left">
                <div class="logo">BIBLEITURA</div>
                    <div class="categoria">LITERATURA BRASILEIRA</div>
                        <h1>Descubra as vozes que moldaram o Brasil</h1>
                        <p>Reúna, atraia e compartilhe suas leituras com uma comunidade 
                        apaixonada por livros brasileiros.</p>
                    <div class="autores">

                </div>
            </div>

            <!-- Painel da direita -->
            <div class="column right">
                <div class="form-container">
                    <div class="header-form">
                        <div class="circle-icon">👤</div>
                        <h2>Entrar na sua conta</h2>
                        <p class="subtitulo">Não tem conta? <a href="cadastro.html">Criar conta</a></p>
                    </div>

                    <form>

                        <div class="form-group">
                            <label>E-MAIL</label>
                            <input type="email" placeholder="bibleitura@exemplo.com.br">
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label>SENHA</label>
                            <div class="password-input">
                                <input type="password" placeholder="Digite sua senha">
                                <input type="password" id="senha" name="senha" required>
                                <span class="eye-icon">👁️</span>
                            </div>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="termos">
                            <label for="termos">Concordo com os <a href="#">Termos de Uso e Política de Privacidade</a> da Bibleitura.</label> <!--Tem que adicionar-->
                        </div>

                        <button type="submit" class="btn-continuar">Continuar</button>
                    </form>
                </div>

            </div>

        </div>
        
    </div>

    <!--adicionei script para o ícone do olho da senha(não sei como arrumar isso, bj)-->
    <script>
            document.querySelectorAll('.eye-icon').forEach(icon => {
            icon.addEventListener('click', () => {
                const input = icon.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = '🙈';
                } else {
                    input.type = 'password';
                    icon.textContent = '👁️';
                }
            });
        });
    </script>

</body>

</html>
